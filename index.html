<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>投資收益管理 V5</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}main{max-width:900px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;margin:4px 0}.muted{color:#6b7280;font-size:13px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,1fr);margin-top:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px}.value{font-size:22px;font-weight:750;margin-top:5px}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tabs button{border:1px solid #dbe0e8;background:#fff;border-radius:11px;padding:10px 14px;white-space:nowrap}.tabs button.active{background:#e9edff;border-color:#5967d9}button{min-height:44px;border-radius:10px;border:1px solid #d7dce5;background:#fff;padding:9px 13px;font-size:15px}.primary{background:#5967d9;color:#fff;border-color:#5967d9}input,select{width:100%;min-height:44px;border:1px solid #d7dce5;border-radius:10px;padding:9px 10px;background:#fff;font-size:16px}.form{grid-template-columns:repeat(5,1fr)}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{text-align:left;padding:10px 7px;border-bottom:1px solid #edf0f4;white-space:nowrap}.holding-mobile{display:none}.pos{color:#16834c}.neg{color:#c43d3d}.hint{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:12px}.err{color:#b42318;font-size:12px}.ok{color:#16834c;font-size:12px}.badge{font-size:12px;padding:4px 7px;border-radius:8px;background:#eef1f6}@media(max-width:680px){.form{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
@media(max-width:520px){
  main{padding:14px 10px 34px}.top{align-items:flex-start}.top h1{font-size:23px}.top button{padding:8px 10px;font-size:14px}
  .card{border-radius:14px;padding:13px}.stats{gap:8px}.stats .card{padding:13px}.value{font-size:20px}
  .table{overflow:visible}.table>table{display:none}.holding-mobile{display:block}
  .holding-card{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
  .holding-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:16px}
  .holding-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px}
  .holding-item{min-width:0}.holding-label{font-size:11px;color:#6b7280;margin-bottom:2px}.holding-value{font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .holding-item.full{grid-column:1/-1}.holding-item.profit{padding-top:5px;border-top:1px solid #edf0f4}.hint{font-size:12px}
}
@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}

</style></head>
<body><main>
<div class="top"><div><h1>投資收益管理</h1><div class="muted">每日收盤價自動更新｜V6</div></div><button id="refresh">↻ 今日更新</button></div>
<div id="status" class="muted status">準備中…</div>
<div class="grid stats"><div class="card"><div class="muted">投入成本</div><div id="cost" class="value">NT$0</div></div><div class="card"><div class="muted">目前市值</div><div id="market" class="value">NT$0</div></div><div class="card"><div class="muted">資本利得</div><div id="gain" class="value">NT$0</div></div><div class="card"><div class="muted">累計股息</div><div id="dividend" class="value">NT$0</div></div></div>
<div class="tabs"><button class="active" data-view="holdings">持股</button><button data-view="trades">交易</button><button data-view="dividends">股息</button><button data-view="settings">設定</button></div>
<section id="view" class="card"></section>
<section class="card" style="margin-top:12px"><h3 style="margin-top:0">新增紀錄</h3><form id="form" class="grid form">
<select id="type"><option value="buy">買入</option><option value="sell">賣出</option><option value="dividend">股息</option></select><input id="ticker" placeholder="代號，例如 2330.TW" required><input id="date" type="date" required><input id="qty" type="number" min="0" step="0.001" placeholder="股數" required><input id="price" type="number" min="0" step="0.01" placeholder="金額/每股" required><input id="fee" class="wide" type="number" min="0" step="0.01" value="0" placeholder="手續費／稅（台幣）"><button class="primary wide" type="submit">＋ 加入紀錄</button>
</form></section>
<div class="hint muted">V6：每日由 GitHub Actions 在伺服器端更新行情，App 只讀取 prices.json，因此不受 iPhone Safari CORS 限制。台股保留 TWD；美股／美國 ETF 保留 USD，並同時換算 TWD。</div>
</main>
<script>
const KEY="investment-pwa-daily-v5";
const defaults={records:[{id:1,type:"buy",ticker:"2330.TW",date:"2026-09-01",qty:2000,price:1110,fee:0,currency:"TWD"},{id:2,type:"buy",ticker:"00981A.TW",date:"2026-09-05",qty:30000,price:24.3,fee:0,currency:"TWD"},{id:3,type:"buy",ticker:"TSMY",date:"2026-09-10",qty:1000,price:1750,fee:0,currency:"TWD"}],prices:{},fx:{USD_TWD:31.5},lastUpdate:"",apiKey:""};
let old=JSON.parse(localStorage.getItem("investment-pwa-daily-v4")||localStorage.getItem("investment-pwa-daily-v2")||"null");
let state=JSON.parse(localStorage.getItem(KEY)||"null")||old||defaults; state.records ||= []; state.prices ||= {}; state.fx ||= {USD_TWD:31.5}; state.apiKey ||= ""; state.records=state.records.map(r=>({...r,currency:r.currency||currency(r.ticker)})); state.records=state.records.filter(r=>!(r.type==="dividend"&&r.ticker==="TSMY"&&Number(r.qty)===1000&&Number(r.price)===18&&r.date==="2026-09-25")); let currentView="holdings";
const money=n=>"NT$"+Math.round(Number(n)||0).toLocaleString("zh-TW"),save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function isUSD(t){return !t.includes(".") && /^[A-Z][A-Z0-9.-]*$/.test(t) && !/^\d/.test(t)}
function currency(t){return isUSD(t)?"USD":"TWD"}
function rawMoney(t,p){return currency(t)==="USD"?"US$"+Number(p||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:4}):"NT$"+Math.round(Number(p)||0).toLocaleString("zh-TW")}
function twdMoney(t,p){return money(quoteTWD(t,p))}
function holdings(){const m={};for(const r of state.records){if(r.type==="dividend")continue;const a=m[r.ticker] ||= {qty:0,cost:0,realized:0};if(r.type==="buy"){a.qty+=r.qty;a.cost+=r.qty*r.price+r.fee}else{const avg=a.qty?a.cost/a.qty:0;a.realized+=(r.price-avg)*r.qty-r.fee;a.qty-=r.qty;a.cost-=avg*r.qty}}return m}
function dividends(){return state.records.filter(r=>r.type==="dividend").reduce((s,r)=>s+quoteTWD(r.ticker,r.qty*r.price-r.fee),0)}
function quoteTWD(t,p){return isUSD(t)?p*(state.fx.USD_TWD||31.5):p}
function rawRecordMoney(r){const cur=r.currency||currency(r.ticker);return cur==="USD"?"US$"+Number(r.price||0).toLocaleString("en-US",{minimumFractionDigits:4,maximumFractionDigits:4}):"NT$"+Math.round(Number(r.price)||0).toLocaleString("zh-TW")}
function recordAmountTWD(r){return quoteTWD(r.ticker,(Number(r.qty)||0)*(Number(r.price)||0)-(Number(r.fee)||0))}
function editRecord(id){const r=state.records.find(x=>x.id===Number(id));if(!r)return;const q=prompt("修改股數",r.qty);if(q===null)return;const qty=Number(q);if(!Number.isFinite(qty)||qty<=0){alert("股數必須大於 0");return}const pr=prompt("修改每股價格（TSMY 用 USD）",r.price);if(pr===null)return;const price=Number(pr);if(!Number.isFinite(price)||price<0){alert("價格格式錯誤");return}const fee=prompt("修改手續費／稅（同該筆原幣別）",r.fee||0);if(fee===null)return;const f=Number(fee);if(!Number.isFinite(f)||f<0){alert("費用格式錯誤");return}r.qty=qty;r.price=price;r.fee=f;r.currency=r.currency||currency(r.ticker);save();render()}
function autoAddTSMYDividends(){const d=[{date:"2026-09-17",price:0.0859},{date:"2026-09-24",price:0.0920},{date:"2026-10-01",price:0.1109}];let added=0;for(const x of d){if(state.records.some(r=>r.type==="dividend"&&r.ticker==="TSMY"&&r.date===x.date))continue;let shares=0;for(const r of state.records.filter(r=>r.ticker==="TSMY").sort((a,b)=>a.date.localeCompare(b.date))){if(r.date>x.date)break;if(r.type==="buy")shares+=Number(r.qty)||0;else if(r.type==="sell")shares-=Number(r.qty)||0}if(shares>0){state.records.push({id:Date.now()+added,type:"dividend",ticker:"TSMY",date:x.date,qty:shares,price:x.price,fee:0,currency:"USD"});added++}}save();render();alert(added?`已加入 ${added} 筆 TSMY 官方配息（稅前、USD）。請依券商實際扣稅在股息紀錄修改「費用／稅」。`:`沒有可新增的 TSMY 配息（可能已加入或除息日當天沒有持股）。`)}
function render(){const h=holdings();let cost=0,market=0,realized=0;for(const[t,a]of Object.entries(h)){cost+=a.cost;market+=a.qty*quoteTWD(t,state.prices[t]??0);realized+=a.realized}const cap=market-cost+realized;document.querySelector("#cost").textContent=money(cost);document.querySelector("#market").textContent=money(market);const g=document.querySelector("#gain");g.textContent=money(cap);g.className="value "+(cap>=0?"pos":"neg");document.querySelector("#dividend").textContent=money(dividends());renderView(h)}
function renderView(h){const v=document.querySelector("#view");if(currentView==="holdings"){v.innerHTML=`<h3 style="margin-top:0">持股</h3><div class="table"><table><thead><tr><th>代號</th><th>股數</th><th>成本<br><span class="muted">台幣</span></th><th>最新價<br><span class="muted">原幣</span></th><th>最新價<br><span class="muted">台幣</span></th><th>市值<br><span class="muted">台幣</span></th><th>損益</th><th></th></tr></thead><tbody>${Object.entries(h).map(([t,a])=>{const p=state.prices[t]??0,mv=a.qty*quoteTWD(t,p),g=mv-a.cost;return `<tr><td><b>${t}</b></td><td>${a.qty.toLocaleString()}</td><td>${money(a.cost)}</td><td>${p?rawMoney(t,p):"—"}</td><td>${p?twdMoney(t,p):"—"}</td><td>${money(mv)}</td><td class="${g>=0?"pos":"neg"}">${money(g)}</td><td><button data-edit-hold="${t}">修改</button></td></tr>`}).join("")}</tbody></table><div class="holding-mobile">${Object.entries(h).map(([t,a])=>{const p=state.prices[t]??0,mv=a.qty*quoteTWD(t,p),g=mv-a.cost;return `<div class="holding-card"><div class="holding-title"><b>${t}</b><span><span class="badge">${currency(t)}</span> <button data-edit-hold="${t}">修改</button></span></div><div class="holding-grid"><div class="holding-item"><div class="holding-label">股數</div><div class="holding-value">${a.qty.toLocaleString()}</div></div><div class="holding-item"><div class="holding-label">成本（台幣）</div><div class="holding-value">${money(a.cost)}</div></div><div class="holding-item"><div class="holding-label">最新價（原幣）</div><div class="holding-value">${p?rawMoney(t,p):"—"}</div></div><div class="holding-item"><div class="holding-label">最新價（台幣）</div><div class="holding-value">${p?twdMoney(t,p):"—"}</div></div><div class="holding-item"><div class="holding-label">市值（台幣）</div><div class="holding-value">${money(mv)}</div></div><div class="holding-item profit"><div class="holding-label">損益（台幣）</div><div class="holding-value ${g>=0?"pos":"neg"}">${money(g)}</div></div></div></div>`}).join("")}</div></div><div class="hint muted">最新價會同時保留原始市場幣別與換算後台幣；美股／美國 ETF 使用 USD/TWD 匯率換算，台股則直接以台幣顯示。</div>`}else if(currentView==="trades"){v.innerHTML=`<h3 style="margin-top:0">交易紀錄</h3><div class="table"><table><thead><tr><th>日期</th><th>類型</th><th>代號</th><th>股數</th><th>價格</th><th>金額</th><th></th></tr></thead><tbody>${state.records.filter(r=>r.type!=="dividend").map(r=>`<tr><td>${r.date}</td><td>${r.type==="buy"?"買入":"賣出"}</td><td><b>${r.ticker}</b></td><td>${r.qty}</td><td>${r.price}</td><td>${money(r.qty*r.price)}</td><td><button data-edit="${r.id}">修改</button> <button data-del="${r.id}">刪除</button></td></tr>`).join("")}</tbody></table></div>`}else if(currentView==="dividends"){v.innerHTML=`<h3 style="margin-top:0">股息紀錄</h3><div class="hint muted">TSMY 配息是 <b>USD／股</b>，台股配息是 <b>TWD／股</b>。以下「實收」會依原幣別扣除費用／稅後再換算台幣。<br><button id="autoTSMY" style="margin-top:8px">加入 TSMY 已公布配息</button></div><div class="table"><table><thead><tr><th>日期</th><th>代號</th><th>股數</th><th>每股（原幣）</th><th>實收（台幣）</th><th></th></tr></thead><tbody>${state.records.filter(r=>r.type==="dividend").map(r=>`<tr><td>${r.date}</td><td><b>${r.ticker}</b></td><td>${r.qty}</td><td>${rawRecordMoney(r)}</td><td class="pos">${money(recordAmountTWD(r))}</td><td><button data-edit="${r.id}">修改</button> <button data-del="${r.id}">刪除</button></td></tr>`).join("")}</tbody></table></div>`}else{v.innerHTML=`<h3 style="margin-top:0">行情設定</h3><p class="muted">V6 已改為由 GitHub Actions 每日從伺服器端取得行情，再部署到 GitHub Pages。App 不再需要 Alpha Vantage API Key。</p><div class="hint"><b>行情來源</b><br>2330.TW、00981A.TW：TWSE OpenAPI<br>TSMY：Yahoo Finance<br>USD/TWD：Yahoo Finance<br><br>最新價會同時保留原始幣別與台幣換算價格。</div><div class="muted" style="margin-top:12px">最後更新：${state.lastUpdate||"尚未更新"}<br>USD/TWD：${(state.fx.USD_TWD||31.5).toFixed(2)}</div>`}v.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{state.records=state.records.filter(x=>x.id!==Number(b.dataset.del));save();render()}));v.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>editRecord(b.dataset.edit)));v.querySelectorAll("[data-edit-hold]").forEach(b=>b.addEventListener("click",()=>{const t=b.dataset.editHold;const buys=state.records.filter(r=>r.ticker===t&&r.type==="buy").sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);if(!buys.length){alert("請到新增紀錄建立買入紀錄");return}editRecord(buys[0].id)}));if(currentView==="dividends"){const b=document.querySelector("#autoTSMY");if(b)b.addEventListener("click",autoAddTSMYDividends)}if(currentView==="settings")document.querySelector("#saveKey").addEventListener("click",()=>{state.apiKey=document.querySelector("#apiKey").value.trim();save();document.querySelector("#status").textContent="API Key 已儲存（V3 會先使用 Yahoo）";})}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentView=b.dataset.view;render()}));
document.querySelector("#date").value=new Date().toISOString().slice(0,10);
document.querySelector("#type").addEventListener("change",()=>{document.querySelector("#price").placeholder=document.querySelector("#type").value==="dividend"?"每股配息（原幣）":"金額/每股";});
document.querySelector("#ticker").addEventListener("input",()=>{const t=document.querySelector("#ticker").value.trim().toUpperCase();document.querySelector("#fee").placeholder=currency(t)==="USD"?"費用／稅（USD）":"手續費／稅（台幣）"});
document.querySelector("#form").addEventListener("submit",e=>{e.preventDefault();const r={id:Date.now(),type:document.querySelector("#type").value,ticker:document.querySelector("#ticker").value.trim().toUpperCase(),date:document.querySelector("#date").value,qty:Number(document.querySelector("#qty").value),price:Number(document.querySelector("#price").value),fee:Number(document.querySelector("#fee").value)||0,currency:currency(document.querySelector("#ticker").value.trim().toUpperCase())};if(!r.ticker||r.qty<=0||r.price<0)return;state.records.push(r);save();e.target.reset();document.querySelector("#date").value=new Date().toISOString().slice(0,10);render()});
async function fetchServerPrices(){const url="prices.json?v="+Date.now();const res=await fetch(url,{cache:"no-store"});if(!res.ok)throw Error("prices.json HTTP "+res.status);return await res.json()}
async function updateDaily(force=false){const st=document.querySelector("#status");st.textContent="讀取每日行情…";try{const d=await fetchServerPrices();const p=d.prices||{};let ok=0,errs=[];for(const t of Object.keys(holdings())){if(p[t]&&Number.isFinite(Number(p[t].price))){state.prices[t]=Number(p[t].price);ok++}else{errs.push(`${t}：${(d.errors||{})[t]||"今日無資料"}`)}}if(d.fx&&d.fx.USD_TWD&&Number.isFinite(Number(d.fx.USD_TWD.value)))state.fx.USD_TWD=Number(d.fx.USD_TWD.value);state.lastUpdate=d.updated_at?new Date(d.updated_at).toLocaleString("zh-TW"):today();save();render();st.innerHTML=`每日行情已更新：${ok}/${Object.keys(holdings()).length} 檔｜伺服器更新 ${state.lastUpdate}${errs.length?`<br><span class="err">${errs.join("；")}</span>`:""}`}catch(e){st.innerHTML=`<span class="err">讀取每日行情失敗：${e.message}</span>`}}
function today(){return new Date().toISOString().slice(0,10)}
document.querySelector("#refresh").addEventListener("click",()=>updateDaily(true));render();updateDaily(false);if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
