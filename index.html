<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>投資收益管理 V5</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}main{max-width:900px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;margin:4px 0}.muted{color:#6b7280;font-size:13px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,1fr);margin-top:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px}.value{font-size:22px;font-weight:750;margin-top:5px}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tabs button{border:1px solid #dbe0e8;background:#fff;border-radius:11px;padding:10px 14px;white-space:nowrap}.tabs button.active{background:#e9edff;border-color:#5967d9}button{min-height:44px;border-radius:10px;border:1px solid #d7dce5;background:#fff;padding:9px 13px;font-size:15px}.primary{background:#5967d9;color:#fff;border-color:#5967d9}input,select{width:100%;min-height:44px;border:1px solid #d7dce5;border-radius:10px;padding:9px 10px;background:#fff;font-size:16px}.form{grid-template-columns:repeat(5,1fr)}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{text-align:left;padding:10px 7px;border-bottom:1px solid #edf0f4;white-space:nowrap}.pos{color:#16834c}.neg{color:#c43d3d}.hint{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:12px}.err{color:#b42318;font-size:12px}.ok{color:#16834c;font-size:12px}.badge{font-size:12px;padding:4px 7px;border-radius:8px;background:#eef1f6}@media(max-width:680px){.form{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}
</style></head>
<body><main>
<div class="top"><div><h1>投資收益管理</h1><div class="muted">每日收盤價自動更新｜V5</div></div><button id="refresh">↻ 今日更新</button></div>
<div id="status" class="muted status">準備中…</div>
<div class="grid stats"><div class="card"><div class="muted">投入成本</div><div id="cost" class="value">NT$0</div></div><div class="card"><div class="muted">目前市值</div><div id="market" class="value">NT$0</div></div><div class="card"><div class="muted">資本利得</div><div id="gain" class="value">NT$0</div></div><div class="card"><div class="muted">累計股息</div><div id="dividend" class="value">NT$0</div></div></div>
<div class="tabs"><button class="active" data-view="holdings">持股</button><button data-view="trades">交易</button><button data-view="dividends">股息</button><button data-view="settings">設定</button></div>
<section id="view" class="card"></section>
<section class="card" style="margin-top:12px"><h3 style="margin-top:0">新增紀錄</h3><form id="form" class="grid form">
<select id="type"><option value="buy">買入</option><option value="sell">賣出</option><option value="dividend">股息</option></select><input id="ticker" placeholder="代號，例如 2330.TW" required><input id="date" type="date" required><input id="qty" type="number" min="0" step="0.001" placeholder="股數" required><input id="price" type="number" min="0" step="0.01" placeholder="金額/每股" required><input id="fee" class="wide" type="number" min="0" step="0.01" value="0" placeholder="手續費／稅（台幣）"><button class="primary wide" type="submit">＋ 加入紀錄</button>
</form></section>
<div class="hint muted">V5：每日由 GitHub Actions 在伺服器端更新行情，App 只讀取 prices.json，因此不受 iPhone Safari CORS 限制。台股保留 TWD；美股／美國 ETF 保留 USD，並同時換算 TWD。</div>
</main>
<script>
const KEY="investment-pwa-daily-v5";
const defaults={records:[{id:1,type:"buy",ticker:"2330.TW",date:"2026-09-01",qty:2000,price:1110,fee:0},{id:2,type:"buy",ticker:"00981A.TW",date:"2026-09-05",qty:30000,price:24.3,fee:0},{id:3,type:"buy",ticker:"TSMY",date:"2026-09-10",qty:1000,price:1750,fee:0},{id:4,type:"dividend",ticker:"TSMY",date:"2026-09-25",qty:1000,price:18,fee:0}],prices:{},fx:{USD_TWD:31.5},lastUpdate:"",apiKey:""};
let old=JSON.parse(localStorage.getItem("investment-pwa-daily-v4")||localStorage.getItem("investment-pwa-daily-v2")||"null");
let state=JSON.parse(localStorage.getItem(KEY)||"null")||old||defaults; state.records ||= []; state.prices ||= {}; state.fx ||= {USD_TWD:31.5}; state.apiKey ||= ""; let currentView="holdings";
const money=n=>"NT$"+Math.round(Number(n)||0).toLocaleString("zh-TW"),save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function isUSD(t){return !t.includes(".") && /^[A-Z][A-Z0-9.-]*$/.test(t) && !/^\d/.test(t)}
function currency(t){return isUSD(t)?"USD":"TWD"}
function rawMoney(t,p){return currency(t)==="USD"?"US$"+Number(p||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:4}):"NT$"+Math.round(Number(p)||0).toLocaleString("zh-TW")}
function twdMoney(t,p){return money(quoteTWD(t,p))}
function holdings(){const m={};for(const r of state.records){if(r.type==="dividend")continue;const a=m[r.ticker] ||= {qty:0,cost:0,realized:0};if(r.type==="buy"){a.qty+=r.qty;a.cost+=r.qty*r.price+r.fee}else{const avg=a.qty?a.cost/a.qty:0;a.realized+=(r.price-avg)*r.qty-r.fee;a.qty-=r.qty;a.cost-=avg*r.qty}}return m}
function dividends(){return state.records.filter(r=>r.type==="dividend").reduce((s,r)=>s+r.qty*r.price-r.fee,0)}
function quoteTWD(t,p){return isUSD(t)?p*(state.fx.USD_TWD||31.5):p}
function render(){const h=holdings();let cost=0,market=0,realized=0;for(const[t,a]of Object.entries(h)){cost+=a.cost;market+=a.qty*quoteTWD(t,state.prices[t]??0);realized+=a.realized}const cap=market-cost+realized;document.querySelector("#cost").textContent=money(cost);document.querySelector("#market").textContent=money(market);const g=document.querySelector("#gain");g.textContent=money(cap);g.className="value "+(cap>=0?"pos":"neg");document.querySelector("#dividend").textContent=money(dividends());renderView(h)}
function renderView(h){const v=document.querySelector("#view");if(currentView==="holdings"){v.innerHTML=`<h3 style="margin-top:0">持股</h3><div class="table"><table><thead><tr><th>代號</th><th>股數</th><th>成本<br><span class="muted">台幣</span></th><th>最新價<br><span class="muted">原幣</span></th><th>最新價<br><span class="muted">台幣</span></th><th>市值<br><span class="muted">台幣</span></th><th>損益</th></tr></thead><tbody>${Object.entries(h).map(([t,a])=>{const p=state.prices[t]??0,mv=a.qty*quoteTWD(t,p),g=mv-a.cost;return `<tr><td><b>${t}</b></td><td>${a.qty.toLocaleString()}</td><td>${money(a.cost)}</td><td>${p?rawMoney(t,p):"—"}</td><td>${p?twdMoney(t,p):"—"}</td><td>${money(mv)}</td><td class="${g>=0?"pos":"neg"}">${money(g)}</td></tr>`}).join("")}</tbody></table></div><div class="hint muted">最新價會同時保留原始市場幣別與換算後台幣；美股／美國 ETF 使用 USD/TWD 匯率換算，台股則直接以台幣顯示。</div>`}else if(currentView==="trades"){v.innerHTML=`<h3 style="margin-top:0">交易紀錄</h3><div class="table"><table><thead><tr><th>日期</th><th>類型</th><th>代號</th><th>股數</th><th>價格</th><th>金額</th><th></th></tr></thead><tbody>${state.records.filter(r=>r.type!=="dividend").map(r=>`<tr><td>${r.date}</td><td>${r.type==="buy"?"買入":"賣出"}</td><td><b>${r.ticker}</b></td><td>${r.qty}</td><td>${r.price}</td><td>${money(r.qty*r.price)}</td><td><button data-del="${r.id}">刪除</button></td></tr>`).join("")}</tbody></table></div>`}else if(currentView==="dividends"){v.innerHTML=`<h3 style="margin-top:0">股息紀錄</h3><div class="table"><table><thead><tr><th>日期</th><th>代號</th><th>股數</th><th>每股</th><th>實收</th><th></th></tr></thead><tbody>${state.records.filter(r=>r.type==="dividend").map(r=>`<tr><td>${r.date}</td><td><b>${r.ticker}</b></td><td>${r.qty}</td><td>${r.price}</td><td class="pos">${money(r.qty*r.price-r.fee)}</td><td><button data-del="${r.id}">刪除</button></td></tr>`).join("")}</tbody></table></div>`}else{v.innerHTML=`<h3 style="margin-top:0">行情設定</h3><p class="muted">V5 已改為由 GitHub Actions 每日從伺服器端取得行情，再部署到 GitHub Pages。App 不再需要 Alpha Vantage API Key。</p><div class="hint"><b>行情來源</b><br>2330.TW、00981A.TW：TWSE OpenAPI<br>TSMY：Yahoo Finance<br>USD/TWD：Yahoo Finance<br><br>最新價會同時保留原始幣別與台幣換算價格。</div><div class="muted" style="margin-top:12px">最後更新：${state.lastUpdate||"尚未更新"}<br>USD/TWD：${(state.fx.USD_TWD||31.5).toFixed(2)}</div>`}v.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{state.records=state.records.filter(x=>x.id!==Number(b.dataset.del));save();render()}));if(currentView==="settings")document.querySelector("#saveKey").addEventListener("click",()=>{state.apiKey=document.querySelector("#apiKey").value.trim();save();document.querySelector("#status").textContent="API Key 已儲存（V3 會先使用 Yahoo）";})}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentView=b.dataset.view;render()}));
document.querySelector("#date").value=new Date().toISOString().slice(0,10);
document.querySelector("#form").addEventListener("submit",e=>{e.preventDefault();const r={id:Date.now(),type:document.querySelector("#type").value,ticker:document.querySelector("#ticker").value.trim().toUpperCase(),date:document.querySelector("#date").value,qty:Number(document.querySelector("#qty").value),price:Number(document.querySelector("#price").value),fee:Number(document.querySelector("#fee").value)||0};if(!r.ticker||r.qty<=0||r.price<0)return;state.records.push(r);save();e.target.reset();document.querySelector("#date").value=new Date().toISOString().slice(0,10);render()});
async function fetchServerPrices(){const url="prices.json?v="+Date.now();const res=await fetch(url,{cache:"no-store"});if(!res.ok)throw Error("prices.json HTTP "+res.status);return await res.json()}
async function updateDaily(force=false){const st=document.querySelector("#status");st.textContent="讀取每日行情…";try{const d=await fetchServerPrices();const p=d.prices||{};let ok=0,errs=[];for(const t of Object.keys(holdings())){if(p[t]&&Number.isFinite(Number(p[t].price))){state.prices[t]=Number(p[t].price);ok++}else{errs.push(`${t}：${(d.errors||{})[t]||"今日無資料"}`)}}if(d.fx&&d.fx.USD_TWD&&Number.isFinite(Number(d.fx.USD_TWD.value)))state.fx.USD_TWD=Number(d.fx.USD_TWD.value);state.lastUpdate=d.updated_at?new Date(d.updated_at).toLocaleString("zh-TW"):today();save();render();st.innerHTML=`每日行情已更新：${ok}/${Object.keys(holdings()).length} 檔｜伺服器更新 ${state.lastUpdate}${errs.length?`<br><span class="err">${errs.join("；")}</span>`:""}`}catch(e){st.innerHTML=`<span class="err">讀取每日行情失敗：${e.message}</span>`}}
function today(){return new Date().toISOString().slice(0,10)}
document.querySelector("#refresh").addEventListener("click",()=>updateDaily(true));render();updateDaily(false);if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
