<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>投資收益管理 V9.4</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#e5e7eb}main{max-width:900px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;margin:4px 0}.muted{color:#9ca3af;font-size:13px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,1fr);margin-top:16px}.card{background:#151b2e;border:1px solid #29324a;border-radius:16px;padding:16px}.value{font-size:22px;font-weight:750;margin-top:5px}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tabs button{border:1px solid #29324a;background:#151b2e;color:#6f86ff;font-weight:700;border-radius:11px;padding:10px 14px;white-space:nowrap}.tabs button.active{background:#e9edff;border-color:#5967d9;color:#3155d9}button{min-height:44px;border-radius:10px;border:1px solid #33405c;background:#151b2e;color:#e5e7eb;padding:9px 13px;font-size:15px}.primary{background:#5967d9;color:#fff;border-color:#5967d9}input,select{width:100%;min-height:44px;border:1px solid #33405c;border-radius:10px;padding:9px 10px;background:#0f1628;color:#e5e7eb;font-size:16px}.form{grid-template-columns:repeat(5,1fr)}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{text-align:left;padding:10px 7px;border-bottom:1px solid #29324a;white-space:nowrap}.holding-mobile{display:none}.pos{color:#16834c}.neg{color:#c43d3d}.hint{background:#10172a;border:1px solid #29324a;border-radius:12px;padding:12px;margin-top:12px}.err{color:#b42318;font-size:12px}.ok{color:#16834c;font-size:12px}.badge{font-size:12px;padding:4px 7px;border-radius:8px;background:#26314a;color:#d1d5db}@media(max-width:680px){.form{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
@media(max-width:520px){
  main{padding:14px 10px 34px}.top{align-items:flex-start}.top h1{font-size:23px}.top button{padding:8px 10px;font-size:14px}
  .card{border-radius:14px;padding:13px}.stats{gap:8px}.stats .card{padding:13px}.value{font-size:20px}
  .table{overflow:visible}.table>table{display:none}.holding-mobile{display:block}
  .holding-card{border:1px solid #29324a;border-radius:14px;padding:12px;margin-bottom:10px;background:#151b2e}
  .holding-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:16px}
  .holding-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px}
  .holding-item{min-width:0}.holding-label{font-size:11px;color:#9ca3af;margin-bottom:2px}.holding-value{font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .holding-item.full{grid-column:1/-1}.holding-item.profit{padding-top:5px;border-top:1px solid #edf0f4}.hint{font-size:12px}
}
@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}

</style></head>
<body><main>
<div class="top"><div><h1>投資收益管理</h1><div class="muted">每日收盤價自動更新｜V9.4</div></div><button id="refresh">↻ 今日更新</button></div>
<div id="status" class="muted status">準備中…</div>
<div class="grid stats"><div class="card"><div class="muted">投入成本</div><div id="cost" class="value">NT$0</div></div><div class="card"><div class="muted">目前市值</div><div id="market" class="value">NT$0</div></div><div class="card"><div class="muted">資本利得</div><div id="gain" class="value">NT$0</div></div><div class="card"><div class="muted">累計股息</div><div id="dividend" class="value">NT$0</div></div></div>
<div class="tabs"><button class="active" data-view="holdings">持股</button><button data-view="trades">交易</button><button data-view="dividends">股息</button></div>
<section id="view" class="card"></section>
<section class="card" style="margin-top:12px"><h3 style="margin-top:0">新增紀錄</h3><form id="form" class="grid form">
<select id="type"><option value="buy">買入</option><option value="sell">賣出</option><option value="dividend">股息</option></select><input id="ticker" placeholder="代號，例如 2330.TW" required><input id="date" type="date" required><input id="qty" type="number" min="0" step="0.001" placeholder="股數" required><input id="price" type="number" min="0" step="0.01" placeholder="金額/每股" required><input id="fee" class="wide" type="number" min="0" step="0.01" value="0" placeholder="手續費／稅（台幣）"><button class="primary wide" type="submit">＋ 加入紀錄</button>
</form></section>
<div class="hint muted">V9.4：每日由 GitHub Actions 在伺服器端更新行情，App 只讀取 prices.json，因此不受 iPhone Safari CORS 限制。台股保留 TWD；美股／美國 ETF 保留 USD，並同時換算 TWD。</div>
</main>
<script>
const KEY="investment-pwa-daily-v9";
const defaults={records:[
{id:101,type:"buy",ticker:"2330.TW",date:"2026-10-02",qty:2005,price:2417.55361596,fee:0,currency:"TWD"},
{id:102,type:"buy",ticker:"00981A.TW",date:"2026-10-02",qty:20000,price:24.28865,fee:0,currency:"TWD"},
{id:103,type:"buy",ticker:"2880.TW",date:"2026-10-02",qty:1216,price:8.0435855263,fee:0,currency:"TWD"},
{id:104,type:"buy",ticker:"2892.TW",date:"2026-10-02",qty:1214,price:0,fee:0,currency:"TWD"},
{id:105,type:"buy",ticker:"TSMY",date:"2026-09-10",qty:1558,price:15.6623876765,fee:0,currency:"USD"},
{id:106,type:"buy",ticker:"TSMY",date:"2026-09-10",qty:1925,price:15.250176623376623,fee:0,currency:"USD"}
],prices:{"2330.TW":2500,"00981A.TW":31.44,"TSMY":16.07},fx:{USD_TWD:31.83},lastUpdate:"",apiKey:""};
let old=JSON.parse(localStorage.getItem("investment-pwa-daily-v7")||localStorage.getItem("investment-pwa-daily-v6")||localStorage.getItem("investment-pwa-daily-v5")||localStorage.getItem("investment-pwa-daily-v4")||localStorage.getItem("investment-pwa-daily-v2")||"null");
let state=JSON.parse(localStorage.getItem(KEY)||"null");
const firstLaunch=!state;
if(!state){
  // Keep existing dividend history, but reset holding transactions to the latest confirmed portfolio snapshot.
  const oldDividends=old&&Array.isArray(old.records)?old.records.filter(r=>r.type==="dividend"): [];
  state={...defaults,records:[...defaults.records,...oldDividends]};
}
state.records ||= []; state.prices ||= {}; state.fx ||= {USD_TWD:31.83}; state.apiKey ||= "";
state.records=state.records.map(r=>({...r,currency:r.currency||currency(r.ticker)}));
state.records=state.records.filter(r=>!(r.type==="dividend"&&r.ticker==="TSMY"&&Number(r.qty)===1000&&Number(r.price)===18&&r.date==="2026-09-25"));
const money=n=>"NT$"+Math.round(Number(n)||0).toLocaleString("zh-TW"),save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function addOfficialDividendRecords(){
  const d=[
    {id:201,ticker:"2330.TW",date:"2026-03-17",qty:2005,price:6.00003573,currency:"TWD",status:"已發放"},
    {id:202,ticker:"2330.TW",date:"2026-06-11",qty:2005,price:6.00003573,currency:"TWD",status:"已發放"},
    {id:203,ticker:"2330.TW",date:"2026-09-16",qty:2005,price:7.00000137,currency:"TWD",status:"待入帳"},
    {id:204,ticker:"00981A.TW",date:"2026-03-17",qty:20000,price:0.41,currency:"TWD",status:"已發放"},
    {id:205,ticker:"00981A.TW",date:"2026-06-16",qty:20000,price:0.63,currency:"TWD",status:"已發放"},
    {id:206,ticker:"00981A.TW",date:"2026-09-16",qty:20000,price:0.63,currency:"TWD",status:"待入帳"},
    {id:207,ticker:"2880.TW",date:"2026-08-13",qty:1216,price:1.35,currency:"TWD",status:"已發放"},
    {id:208,ticker:"2892.TW",date:"2026-08-11",qty:1214,price:1.30,currency:"TWD",status:"已發放"}
  ];
  let added=0; for(const x of d){if(!state.records.some(r=>r.type==="dividend"&&r.ticker===x.ticker&&r.date===x.date)){state.records.push({id:x.id,type:"dividend",...x,fee:0});added++;}}
  return added;
}
const KNOWN_DIVIDENDS=[
{id:201,type:"dividend",ticker:"2330.TW",date:"2026-03-17",payoutDate:"2026-04-09",qty:2005,price:6.00003573,fee:0,currency:"TWD",status:"已入帳"},
{id:202,type:"dividend",ticker:"2330.TW",date:"2026-06-11",payoutDate:"2026-07-09",qty:2005,price:6.00003573,fee:0,currency:"TWD",status:"已入帳"},
{id:203,type:"dividend",ticker:"2330.TW",date:"2026-09-16",payoutDate:"2026-10-08",qty:2005,price:7.00000137,fee:0,currency:"TWD",status:"待入帳"},
{id:204,type:"dividend",ticker:"00981A.TW",date:"2026-03-17",payoutDate:"2026-04-10",qty:20000,price:0.41,fee:0,currency:"TWD",status:"已入帳"},
{id:205,type:"dividend",ticker:"00981A.TW",date:"2026-06-16",payoutDate:"2026-07-09",qty:20000,price:0.63,fee:0,currency:"TWD",status:"已入帳"},
{id:206,type:"dividend",ticker:"00981A.TW",date:"2026-09-16",payoutDate:"2026-10-13",qty:20000,price:0.63,fee:0,currency:"TWD",status:"待入帳"},
{id:207,type:"dividend",ticker:"2880.TW",date:"2026-08-13",payoutDate:"2026-08-28",qty:1216,price:1.35,fee:0,currency:"TWD",status:"已入帳"},
{id:208,type:"dividend",ticker:"2892.TW",date:"2026-08-11",payoutDate:"2026-08-28",qty:1214,price:1.30,fee:0,currency:"TWD",status:"已入帳"}
];
// 只在第一次建立資料時帶入官方股息範例；之後尊重使用者自行修改／刪除的資料，重新開啟 App 不再覆蓋。
if(firstLaunch && !state.__dividendSeeded){
  for(const d of KNOWN_DIVIDENDS){if(!state.records.some(r=>r.type==="dividend"&&r.ticker===d.ticker&&r.date===d.date))state.records.push(d);}
  state.__dividendSeeded=true;
  save();
}

let currentView="holdings";
function isUSD(t){return !t.includes(".") && /^[A-Z][A-Z0-9.-]*$/.test(t) && !/^\d/.test(t)}
function currency(t){return isUSD(t)?"USD":"TWD"}
function rawMoney(t,p){if(currency(t)==="USD")return "US$"+Number(p||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:4});const n=Number(p)||0;return "NT$"+n.toLocaleString("zh-TW",{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2})}
function twdMoney(t,p){return money(quoteTWD(t,p))}
function holdings(){const m={};for(const r of state.records){if(r.type==="dividend")continue;const a=m[r.ticker] ||= {qty:0,cost:0,realized:0,currency:r.currency||currency(r.ticker)};if(r.type==="buy"){a.qty+=Number(r.qty)||0;a.cost+=(Number(r.qty)||0)*(Number(r.price)||0)+(Number(r.fee)||0)}else{const avg=a.qty?a.cost/a.qty:0;a.realized+=((Number(r.price)||0)-avg)*(Number(r.qty)||0)-(Number(r.fee)||0);a.qty-=Number(r.qty)||0;a.cost-=avg*(Number(r.qty)||0)}}return m}
function dividendTax(r){const gross=(Number(r.qty)||0)*(Number(r.price)||0);return isUSD(r.ticker)?gross*0.30:0}
function dividendGross(r){return (Number(r.qty)||0)*(Number(r.price)||0)}
function dividendNet(r){return Math.max(0,dividendGross(r)-dividendTax(r))}
function dividends(){return state.records.filter(r=>r.type==="dividend").reduce((s,r)=>s+quoteTWD(r.ticker,dividendNet(r)),0)}
function dividendByTicker(t){return state.records.filter(r=>r.type==="dividend"&&r.ticker===t).reduce((s,r)=>s+quoteTWD(r.ticker,dividendNet(r)),0)}
function quoteTWD(t,p){return isUSD(t)?p*(state.fx.USD_TWD||31.5):p}
function rawRecordMoney(r){const cur=r.currency||currency(r.ticker);return cur==="USD"?"US$"+Number(r.price||0).toLocaleString("en-US",{minimumFractionDigits:4,maximumFractionDigits:4}):"NT$"+Math.round(Number(r.price)||0).toLocaleString("zh-TW")}
function recordAmountTWD(r){return quoteTWD(r.ticker,(Number(r.qty)||0)*(Number(r.price)||0)-(Number(r.fee)||0))}
function editRecord(id){const r=state.records.find(x=>x.id===Number(id));if(!r)return;const q=prompt("修改股數",r.qty);if(q===null)return;const qty=Number(q);if(!Number.isFinite(qty)||qty<=0){alert("股數必須大於 0");return}const pr=prompt("修改每股價格（TSMY 用 USD）",r.price);if(pr===null)return;const price=Number(pr);if(!Number.isFinite(price)||price<0){alert("價格格式錯誤");return}const fee=prompt("修改手續費／稅（同該筆原幣別）",r.fee||0);if(fee===null)return;const f=Number(fee);if(!Number.isFinite(f)||f<0){alert("費用格式錯誤");return}r.qty=qty;r.price=price;r.fee=f;r.currency=r.currency||currency(r.ticker);save();render()}
function autoAddTSMYDividends(){const d=[{date:"2026-09-17",price:0.0859},{date:"2026-09-24",price:0.0920},{date:"2026-10-01",price:0.1109}];let added=0;for(const x of d){if(state.records.some(r=>r.type==="dividend"&&r.ticker==="TSMY"&&r.date===x.date))continue;let shares=0;for(const r of state.records.filter(r=>r.ticker==="TSMY").sort((a,b)=>a.date.localeCompare(b.date))){if(r.date>x.date)break;if(r.type==="buy")shares+=Number(r.qty)||0;else if(r.type==="sell")shares-=Number(r.qty)||0}if(shares>0){state.records.push({id:Date.now()+added,type:"dividend",ticker:"TSMY",date:x.date,qty:shares,price:x.price,fee:0,currency:"USD"});added++}}save();render();alert(added?`已加入 ${added} 筆 TSMY 官方配息（稅前、USD）。請依券商實際扣稅在股息紀錄修改「費用／稅」。`:`沒有可新增的 TSMY 配息（可能已加入或除息日當天沒有持股）。`)}
function render(){const h=holdings();let cost=0,market=0,realized=0;for(const[t,a]of Object.entries(h)){const fx=isUSD(t)?(state.fx.USD_TWD||31.83):1;cost+=a.cost*fx;market+=a.qty*quoteTWD(t,state.prices[t]??0);realized+=a.realized*fx}const cap=market-cost+realized;document.querySelector("#cost").textContent=money(cost);document.querySelector("#market").textContent=money(market);const g=document.querySelector("#gain");g.textContent=money(cap);g.className="value "+(cap>=0?"pos":"neg");document.querySelector("#dividend").textContent=money(dividends());renderView(h)}
function latestUserBuy(t){return state.records.filter(r=>r.ticker===t&&r.type==="buy"&&Number(r.id)>106).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)[0]||null}
function renderView(h){
  const v=document.querySelector("#view");
  if(currentView==="holdings"){
    const cards=Object.entries(h).map(([t,a])=>{
      const p=state.prices[t]??0,mv=a.qty*quoteTWD(t,p),fx=isUSD(t)?(state.fx.USD_TWD||31.83):1,costTWD=a.cost*fx,g=mv-costTWD,ub=latestUserBuy(t);
      const actions=`<button data-edit-hold="${t}">修改</button>${ub?` <button data-del-hold="${ub.id}">刪除</button>`:""}`;
      return `<div class="holding-card"><div class="holding-title"><b>${t}</b><span><span class="badge">${currency(t)}</span> ${actions}</span></div><div class="holding-grid"><div class="holding-item"><div class="holding-label">股數</div><div class="holding-value">${a.qty.toLocaleString()}</div></div><div class="holding-item"><div class="holding-label">成本（原幣）</div><div class="holding-value">${isUSD(t)?"US$":"NT$"}${Number(a.cost).toLocaleString("en-US",{minimumFractionDigits:isUSD(t)?2:0,maximumFractionDigits:isUSD(t)?2:0})}</div></div><div class="holding-item"><div class="holding-label">成本（台幣）</div><div class="holding-value">${money(costTWD)}</div></div><div class="holding-item"><div class="holding-label">最新價（原幣）</div><div class="holding-value">${p?rawMoney(t,p):"—"}</div></div><div class="holding-item"><div class="holding-label">最新價（台幣）</div><div class="holding-value">${p?twdMoney(t,p):"—"}</div></div><div class="holding-item"><div class="holding-label">市值（台幣）</div><div class="holding-value">${money(mv)}</div></div><div class="holding-item profit"><div class="holding-label">損益（台幣）</div><div class="holding-value ${g>=0?"pos":"neg"}">${money(g)}</div></div><div class="holding-item"><div class="holding-label">累計股息（台幣）</div><div class="holding-value pos">${money(dividendByTicker(t))}</div></div></div></div>`;
    }).join("");
    const rows=Object.entries(h).map(([t,a])=>{
      const p=state.prices[t]??0,mv=a.qty*quoteTWD(t,p),fx=isUSD(t)?(state.fx.USD_TWD||31.83):1,costTWD=a.cost*fx,g=mv-costTWD,ub=latestUserBuy(t);
      return `<tr><td><b>${t}</b></td><td>${a.qty.toLocaleString()}</td><td>${isUSD(t)?"US$":"NT$"}${Number(a.cost).toLocaleString("en-US",{minimumFractionDigits:isUSD(t)?2:0,maximumFractionDigits:isUSD(t)?2:0})}</td><td>${money(costTWD)}</td><td>${p?rawMoney(t,p):"—"}</td><td>${p?twdMoney(t,p):"—"}</td><td>${money(mv)}</td><td class="${g>=0?"pos":"neg"}">${money(g)}</td><td class="pos">${money(dividendByTicker(t))}</td><td><button data-edit-hold="${t}">修改</button>${ub?` <button data-del-hold="${ub.id}">刪除</button>`:""}</td></tr>`;
    }).join("");
    v.innerHTML=`<h3 style="margin-top:0">持股</h3><div class="table"><table><thead><tr><th>代號</th><th>股數</th><th>成本<br><span class="muted">原幣</span></th><th>成本<br><span class="muted">台幣</span></th><th>最新價<br><span class="muted">原幣</span></th><th>最新價<br><span class="muted">台幣</span></th><th>市值<br><span class="muted">台幣</span></th><th>損益</th><th>累計股息</th><th></th></tr></thead><tbody>${rows}</tbody></table><div class="holding-mobile">${cards}</div></div><div class="hint muted">持股成本依交易紀錄計算；「刪除」只會刪除你後來新增的買入紀錄，不會刪除原始持股。最新價每天更新一次。</div>`;
  }else if(currentView==="trades"){
    v.innerHTML=`<h3 style="margin-top:0">交易紀錄</h3><div class="table"><table><thead><tr><th>日期</th><th>類型</th><th>代號</th><th>股數</th><th>價格</th><th>金額</th><th></th></tr></thead><tbody>${state.records.filter(r=>r.type!=="dividend").map(r=>`<tr><td>${r.date}</td><td>${r.type==="buy"?"買入":"賣出"}</td><td><b>${r.ticker}</b></td><td>${r.qty}</td><td>${r.price}</td><td>${money(r.qty*r.price)}</td><td><button data-edit="${r.id}">修改</button> <button data-del="${r.id}">刪除</button></td></tr>`).join("")}</tbody></table></div>`;
  }else if(currentView==="dividends"){
    const rows=state.records.filter(r=>r.type==="dividend");
    v.innerHTML=`<h3 style="margin-top:0">股息紀錄</h3><div class="hint muted">美股／美國 ETF 配息：<b>USD／股</b>，自動預扣 <b>30%</b>；台股配息：<b>TWD／股</b>，不預扣30%。<br><button id="autoTSMY" style="margin-top:8px">加入 TSMY 已公布配息</button></div><div class="table"><table><thead><tr><th>日期</th><th>代號</th><th>股數</th><th>每股配息</th><th>原幣稅前</th><th>美股預扣30%</th><th>原幣稅後</th><th>台幣稅後</th><th>狀態</th><th></th></tr></thead><tbody>${rows.map(r=>{const cur=r.currency||currency(r.ticker),gross=dividendGross(r),tax=dividendTax(r),net=dividendNet(r),taxText=isUSD(r.ticker)?`US$${tax.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:4})}`:"—";return `<tr><td>${r.date}</td><td><b>${r.ticker}</b></td><td>${r.qty.toLocaleString()}</td><td>${rawRecordMoney(r)}</td><td>${cur==="USD"?"US$":"NT$"}${gross.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:4})}</td><td>${taxText}</td><td class="pos">${cur==="USD"?"US$":"NT$"}${net.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:4})}</td><td class="pos">${money(quoteTWD(r.ticker,net))}</td><td>${r.status||"已入帳"}</td><td><button data-edit="${r.id}">修改</button> <button data-del="${r.id}">刪除</button></td></tr>`}).join("")}</tbody></table><div class="holding-mobile">${rows.map(r=>{const cur=r.currency||currency(r.ticker),gross=dividendGross(r),tax=dividendTax(r),net=dividendNet(r),taxText=isUSD(r.ticker)?`US$${tax.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:4})}`:"—";return `<div class="holding-card"><div class="holding-title"><b>${r.ticker}</b><span>${r.date}</span></div><div class="holding-grid"><div class="holding-item"><div class="holding-label">股數</div><div class="holding-value">${r.qty.toLocaleString()}</div></div><div class="holding-item"><div class="holding-label">每股配息</div><div class="holding-value">${rawRecordMoney(r)}</div></div><div class="holding-item"><div class="holding-label">原幣稅前</div><div class="holding-value">${cur==="USD"?"US$":"NT$"}${gross.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:4})}</div></div><div class="holding-item"><div class="holding-label">美股預扣30%</div><div class="holding-value">${taxText}</div></div><div class="holding-item"><div class="holding-label">原幣稅後</div><div class="holding-value pos">${cur==="USD"?"US$":"NT$"}${net.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:4})}</div></div><div class="holding-item profit"><div class="holding-label">台幣稅後</div><div class="holding-value pos">${money(quoteTWD(r.ticker,net))}</div></div><div class="holding-item"><div class="holding-label">狀態</div><div class="holding-value">${r.status||"已入帳"}</div></div><div class="holding-item full"><button data-edit="${r.id}">修改</button> <button data-del="${r.id}">刪除</button></div></div></div>`}).join("")}</div></div>`;
  }
  v.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{if(confirm("確定要刪除這筆紀錄嗎？")){state.records=state.records.filter(x=>x.id!==Number(b.dataset.del));save();render()}}));
  v.querySelectorAll("[data-del-hold]").forEach(b=>b.addEventListener("click",()=>{if(confirm("確定要刪除這筆新增的買入紀錄嗎？")){state.records=state.records.filter(x=>x.id!==Number(b.dataset.delHold));save();render()}}));
  v.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>editRecord(b.dataset.edit)));
  v.querySelectorAll("[data-edit-hold]").forEach(b=>b.addEventListener("click",()=>{const t=b.dataset.editHold;const buys=state.records.filter(r=>r.ticker===t&&r.type==="buy").sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);if(!buys.length){alert("請到新增紀錄建立買入紀錄");return}editRecord(buys[0].id)}));
  if(currentView==="dividends"){const b=document.querySelector("#autoTSMY");if(b)b.addEventListener("click",autoAddTSMYDividends)}
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentView=b.dataset.view;render()}));
document.querySelector("#date").value=new Date().toISOString().slice(0,10);
document.querySelector("#type").addEventListener("change",()=>{document.querySelector("#price").placeholder=document.querySelector("#type").value==="dividend"?"每股配息（原幣）":"金額/每股";});
document.querySelector("#ticker").addEventListener("input",()=>{const t=document.querySelector("#ticker").value.trim().toUpperCase();document.querySelector("#fee").placeholder=currency(t)==="USD"?"費用／稅（USD）":"手續費／稅（台幣）"});
document.querySelector("#form").addEventListener("submit",e=>{e.preventDefault();const r={id:Date.now(),type:document.querySelector("#type").value,ticker:document.querySelector("#ticker").value.trim().toUpperCase(),date:document.querySelector("#date").value,qty:Number(document.querySelector("#qty").value),price:Number(document.querySelector("#price").value),fee:Number(document.querySelector("#fee").value)||0,currency:currency(document.querySelector("#ticker").value.trim().toUpperCase())};if(!r.ticker||r.qty<=0||r.price<0)return;state.records.push(r);save();e.target.reset();document.querySelector("#date").value=new Date().toISOString().slice(0,10);render()});
async function fetchServerPrices(){const url="prices.json?v="+Date.now();const res=await fetch(url,{cache:"no-store"});if(!res.ok)throw Error("prices.json HTTP "+res.status);return await res.json()}
async function updateDaily(force=false){const st=document.querySelector("#status");st.textContent="讀取每日行情…";try{const d=await fetchServerPrices();const p=d.prices||{};let ok=0,errs=[];for(const t of Object.keys(holdings())){if(p[t]&&Number.isFinite(Number(p[t].price))){state.prices[t]=Number(p[t].price);ok++}else{errs.push(`${t}：${(d.errors||{})[t]||"今日無資料"}`)}}if(d.fx&&d.fx.USD_TWD&&Number.isFinite(Number(d.fx.USD_TWD.value)))state.fx.USD_TWD=Number(d.fx.USD_TWD.value);state.lastUpdate=d.updated_at?new Date(d.updated_at).toLocaleString("zh-TW"):today();save();render();st.innerHTML=`每日行情已更新：${ok}/${Object.keys(holdings()).length} 檔｜伺服器更新 ${state.lastUpdate}${errs.length?`<br><span class="err">${errs.join("；")}</span>`:""}`}catch(e){st.innerHTML=`<span class="err">讀取每日行情失敗：${e.message}</span>`}}
function today(){return new Date().toISOString().slice(0,10)}
document.querySelector("#refresh").addEventListener("click",()=>updateDaily(true));render();updateDaily(false);if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
