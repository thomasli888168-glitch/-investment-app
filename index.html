<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>投資收益管理</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
main{max-width:900px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:24px;margin:4px 0}.muted{color:#6b7280;font-size:13px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,1fr);margin-top:16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px}.value{font-size:22px;font-weight:750;margin-top:5px}
.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tabs button{border:1px solid #dbe0e8;background:#fff;border-radius:11px;padding:10px 14px;white-space:nowrap}
.tabs button.active{background:#e9edff;border-color:#5967d9}button{min-height:44px;border-radius:10px;border:1px solid #d7dce5;background:#fff;padding:9px 13px;font-size:15px}.primary{background:#5967d9;color:#fff;border-color:#5967d9}
input,select{width:100%;min-height:44px;border:1px solid #d7dce5;border-radius:10px;padding:9px 10px;background:#fff;font-size:16px}.form{grid-template-columns:repeat(5,1fr)}
.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{text-align:left;padding:10px 7px;border-bottom:1px solid #edf0f4;white-space:nowrap}.pos{color:#16834c}.neg{color:#c43d3d}
.badge{font-size:12px;padding:4px 7px;border-radius:8px;background:#eef1f6}.status{margin-top:7px}.hint{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:12px}
@media(max-width:680px){.form{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}
</style></head>
<body><main>
<div class="top"><div><h1>投資收益管理</h1><div class="muted">每日收盤價自動更新</div></div><button id="refresh">↻ 今日更新</button></div>
<div id="status" class="muted status">準備中…</div>
<div class="grid stats">
<div class="card"><div class="muted">投入成本</div><div id="cost" class="value">NT$0</div></div>
<div class="card"><div class="muted">目前市值</div><div id="market" class="value">NT$0</div></div>
<div class="card"><div class="muted">資本利得</div><div id="gain" class="value">NT$0</div></div>
<div class="card"><div class="muted">累計股息</div><div id="dividend" class="value">NT$0</div></div></div>
<div class="tabs"><button class="active" data-view="holdings">持股</button><button data-view="trades">交易</button><button data-view="dividends">股息</button><button data-view="settings">設定</button></div>
<section id="view" class="card"></section>
<section class="card" style="margin-top:12px"><h3 style="margin-top:0">新增紀錄</h3>
<form id="form" class="grid form">
<select id="type"><option value="buy">買入</option><option value="sell">賣出</option><option value="dividend">股息</option></select>
<input id="ticker" placeholder="代號，例如 2330.TW" required><input id="date" type="date" required>
<input id="qty" type="number" min="0" step="0.001" placeholder="股數" required><input id="price" type="number" min="0" step="0.01" placeholder="成交價/每股股息" required>
<input id="fee" class="wide" type="number" min="0" step="0.01" value="0" placeholder="手續費／稅"><button class="primary wide" type="submit">＋ 加入紀錄</button>
</form></section>
<div class="hint muted">行情模式：每日只查詢一次。App 每天第一次開啟時自動更新；iPhone 不保證 PWA 在完全關閉狀態下於背景自動執行，因此若當天沒有開啟 App，不會在背景偷偷更新。</div>
</main>
<script>
const KEY="investment-pwa-daily-v2";
const defaults={records:[
{id:1,type:"buy",ticker:"2330.TW",date:"2026-09-01",qty:2000,price:1110,fee:0},
{id:2,type:"buy",ticker:"00981A.TW",date:"2026-09-05",qty:30000,price:24.3,fee:0},
{id:3,type:"buy",ticker:"TSMY",date:"2026-09-10",qty:1000,price:1750,fee:0},
{id:4,type:"dividend",ticker:"TSMY",date:"2026-09-25",qty:1000,price:18,fee:0}],prices:{},lastUpdate:"",apiKey:""};
let state=JSON.parse(localStorage.getItem(KEY)||"null")||defaults,currentView="holdings";
const money=n=>"NT$"+Math.round(Number(n)||0).toLocaleString("zh-TW"),save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function holdings(){const m={};for(const r of state.records){if(r.type==="dividend")continue;const a=m[r.ticker] ||= {qty:0,cost:0,realized:0};
if(r.type==="buy"){a.qty+=r.qty;a.cost+=r.qty*r.price+r.fee}else{const avg=a.qty?a.cost/a.qty:0;a.realized+=(r.price-avg)*r.qty-r.fee;a.qty-=r.qty;a.cost-=avg*r.qty}}return m}
function dividends(){return state.records.filter(r=>r.type==="dividend").reduce((s,r)=>s+r.qty*r.price-r.fee,0)}
function render(){const h=holdings();let cost=0,market=0,realized=0;for(const[t,a]of Object.entries(h)){cost+=a.cost;market+=a.qty*(state.prices[t]??0);realized+=a.realized}
const cap=market-cost+realized;document.querySelector("#cost").textContent=money(cost);document.querySelector("#market").textContent=money(market);
const g=document.querySelector("#gain");g.textContent=money(cap);g.className="value "+(cap>=0?"pos":"neg");document.querySelector("#dividend").textContent=money(dividends());renderView(h)}
function renderView(h){const v=document.querySelector("#view");
if(currentView==="holdings"){v.innerHTML=`<h3 style="margin-top:0">持股</h3><div class="table"><table><thead><tr><th>代號</th><th>股數</th><th>成本</th><th>最新價</th><th>市值</th><th>損益</th></tr></thead><tbody>${Object.entries(h).map(([t,a])=>{const p=state.prices[t]??0,mv=a.qty*p,g=mv-a.cost;return `<tr><td><b>${t}</b></td><td>${a.qty.toLocaleString()}</td><td>${money(a.cost)}</td><td>${p?money(p):"—"}</td><td>${money(mv)}</td><td class="${g>=0?"pos":"neg"}">${money(g)}</td></tr>`}).join("")}</tbody></table></div>`}
else if(currentView==="trades"){v.innerHTML=`<h3 style="margin-top:0">交易紀錄</h3><div class="table"><table><thead><tr><th>日期</th><th>類型</th><th>代號</th><th>股數</th><th>價格</th><th>金額</th><th></th></tr></thead><tbody>${state.records.filter(r=>r.type!=="dividend").map(r=>`<tr><td>${r.date}</td><td>${r.type==="buy"?"買入":"賣出"}</td><td><b>${r.ticker}</b></td><td>${r.qty}</td><td>${r.price}</td><td>${money(r.qty*r.price)}</td><td><button data-del="${r.id}">刪除</button></td></tr>`).join("")}</tbody></table></div>`}
else if(currentView==="dividends"){v.innerHTML=`<h3 style="margin-top:0">股息紀錄</h3><div class="table"><table><thead><tr><th>日期</th><th>代號</th><th>股數</th><th>每股</th><th>實收</th><th></th></tr></thead><tbody>${state.records.filter(r=>r.type==="dividend").map(r=>`<tr><td>${r.date}</td><td><b>${r.ticker}</b></td><td>${r.qty}</td><td>${r.price}</td><td class="pos">${money(r.qty*r.price-r.fee)}</td><td><button data-del="${r.id}">刪除</button></td></tr>`).join("")}</tbody></table></div>`}
else{v.innerHTML=`<h3 style="margin-top:0">行情設定</h3><label class="muted">Alpha Vantage 免費 API Key</label><input id="apiKey" type="password" value="${state.apiKey||""}" placeholder="貼上你的 API Key" style="margin-top:6px"><p class="muted">免費方案目前為每日 25 次 API requests；你的 App 每天只查一次，3 檔標的只需約 3 次。Alpha Vantage 的日線 API 可提供全球股票的每日資料。<br>注意：API Key 存在此瀏覽器的本機資料中，適合個人使用；若日後公開給其他人使用，應改成後端代理。</p><button id="saveKey" class="primary">儲存 API Key</button><div class="muted" style="margin-top:12px">最後更新：${state.lastUpdate||"尚未更新"}</div>`}
v.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{state.records=state.records.filter(x=>x.id!==Number(b.dataset.del));save();render()}));
if(currentView==="settings")document.querySelector("#saveKey").addEventListener("click",()=>{state.apiKey=document.querySelector("#apiKey").value.trim();save();document.querySelector("#status").textContent="API Key 已儲存";});
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentView=b.dataset.view;render()}));
document.querySelector("#date").value=new Date().toISOString().slice(0,10);
document.querySelector("#form").addEventListener("submit",e=>{e.preventDefault();const r={id:Date.now(),type:document.querySelector("#type").value,ticker:document.querySelector("#ticker").value.trim().toUpperCase(),date:document.querySelector("#date").value,qty:Number(document.querySelector("#qty").value),price:Number(document.querySelector("#price").value),fee:Number(document.querySelector("#fee").value)||0};if(!r.ticker||r.qty<=0||r.price<0)return;state.records.push(r);save();e.target.reset();document.querySelector("#date").value=new Date().toISOString().slice(0,10);render()});
function today(){return new Date().toISOString().slice(0,10)}
async function fetchAV(ticker){const url=`https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${encodeURIComponent(ticker)}&outputsize=compact&apikey=${encodeURIComponent(state.apiKey)}`;const res=await fetch(url,{cache:"no-store"});if(!res.ok)throw Error("HTTP");const j=await res.json();const ts=j["Time Series (Daily)"];if(!ts)throw Error(j["Note"]||j["Information"]||"沒有日線資料");const dates=Object.keys(ts).sort().reverse();if(!dates.length)throw Error("沒有資料");return {price:Number(ts[dates[0]]["4. close"]),date:dates[0]}}
async function updateDaily(force=false){const st=document.querySelector("#status");if(!state.apiKey){st.textContent="尚未設定免費行情 API Key；請到「設定」貼上 API Key。";return}
if(!force&&state.lastUpdate===today()){st.textContent="今日已更新："+state.lastUpdate;return}
st.textContent="正在更新每日收盤價…";const tickers=[...new Set(Object.keys(holdings()))];let ok=0,errs=[];
for(const t of tickers){try{const r=await fetchAV(t);state.prices[t]=r.price;ok++;}catch(e){errs.push(t)}}
if(ok){state.lastUpdate=today();save();render();st.textContent=`今日更新完成：${ok} 檔｜${new Date().toLocaleString("zh-TW")}${errs.length?"｜失敗："+errs.join(", "):""}`}
else st.textContent="今日行情更新失敗，保留上次價格。"+(errs.length?"（"+errs.join(", ")+"）":"")}
document.querySelector("#refresh").addEventListener("click",()=>updateDaily(true));
render();updateDaily(false);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
